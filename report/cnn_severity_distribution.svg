  <text x="430" y="646" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#ffffff">36,5%</text>
  <text x="804" y="646" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#ffffff">31,4%</text>
  <text x="1152" y="646" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#ffffff">32,1%</text>

  <text x="90" y="745" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#111827">validation</text>
  <rect x="260" y="710" width="1100" height="56" rx="16" fill="#F3F4F6"/>
  <rect x="260" y="710" width="231" height="56" rx="16" fill="#22C55E"/>
  <rect x="491" y="710" width="443" height="56" fill="#F59E0B"/>
  <rect x="934" y="710" width="426" height="56" rx="16" fill="#EF4444"/>
  <text x="343" y="746" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#ffffff">21,0%</text>
  <text x="684" y="746" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#ffffff">40,3%</text>
  <text x="1118" y="746" font-family="Arial, Segoe UI, sans-serif" font-size="21" font-weight="700" fill="#ffffff">38,7%</text>

  <text x="90" y="820" font-family="Arial, Segoe UI, sans-serif" font-size="21" fill="#6B7280">
