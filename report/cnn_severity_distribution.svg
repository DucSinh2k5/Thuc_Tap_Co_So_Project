  </text>
  <text x="90" y="140" font-family="Arial, Segoe UI, sans-serif" font-size="26" fill="#4B5563">
    Dataset CNN severity classification - folder thực tế: 01-minor, 02-moderate, 03-severe
  </text>

  <rect x="1170" y="65" width="340" height="58" rx="18" fill="#F3F4F6" stroke="#E5E7EB"/>
  <text x="1195" y="103" font-family="Arial, Segoe UI, sans-serif" font-size="24" fill="#374151">
    Tổng số ảnh: 3.335
  </text>

  <!-- Table -->
