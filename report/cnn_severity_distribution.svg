  <rect x="265" y="545" width="22" height="22" rx="6" fill="#F59E0B"/>
  <text x="298" y="564" font-family="Arial, Segoe UI, sans-serif" font-size="22" fill="#374151">02-moderate</text>
  <rect x="495" y="545" width="22" height="22" rx="6" fill="#EF4444"/>
  <text x="528" y="564" font-family="Arial, Segoe UI, sans-serif" font-size="22" fill="#374151">03-severe</text>

