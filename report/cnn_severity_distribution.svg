  <text x="90" y="645" font-family="Arial, Segoe UI, sans-serif" font-size="25" font-weight="700" fill="#111827">training</text>
  <rect x="260" y="610" width="1100" height="56" rx="16" fill="#F3F4F6"/>
  <rect x="260" y="610" width="402" height="56" rx="16" fill="#22C55E"/>
  <rect x="662" y="610" width="345" height="56" fill="#F59E0B"/>
