  <text x="700" y="244" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#111827">02-moderate</text>
  <text x="1000" y="244" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#111827">03-severe</text>
  <text x="1320" y="244" font-family="Arial, Segoe UI, sans-serif" font-size="23" font-weight="700" fill="#111827">Tổng</text>

  <text x="90" y="315" font-family="Arial, Segoe UI, sans-serif" font-size="24" fill="#111827">training</text>
  <text x="455" y="315" font-family="Arial, Segoe UI, sans-serif" font-size="24" fill="#111827">1.076</text>
  <text x="735" y="315" font-family="Arial, Segoe UI, sans-serif" font-size="24" fill="#111827">924</text>
  <text x="1035" y="315" font-family="Arial, Segoe UI, sans-serif" font-size="24" fill="#111827">945</text>
  <text x="1328" y="315" font-family="Arial, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#111827">2.945</text>
  <line x1="90" y1="350" x2="1510" y2="350" stroke="#E5E7EB" stroke-width="1"/>

  <text x="90" y="405" font-family="Arial, Segoe UI, sans-serif" font-size="24" fill="#111827">validation</text>
  <text x="465" y="405" font-family="Arial, Segoe UI, sans-serif" font-size="24" fill="#111827">82</text>
  <text x="735" y="405" font-family="Arial, Segoe UI, sans-serif" font-size="24" fill="#111827">157</text>
  <text x="1035" y="405" font-family="Arial, Segoe UI, sans-serif" font-size="24" fill="#111827">151</text>
  <text x="1342" y="405" font-family="Arial, Segoe UI, sans-serif" font-size="24" font-weight="700" fill="#111827">390</text>
  <line x1="90" y1="440" x2="1510" y2="440" stroke="#E5E7EB" stroke-width="1"/>

  <!-- Legend -->
